{% extends "base.html" %}
{% block title %}Data Hub - StockAnalysisSystem{% endblock %}
{% block content %}
<h1>Data Hub</h1>

<form class="filters" onsubmit="return false;">
  <label>Identity (for the row you update)
    <input type="text" id="identity" placeholder="e.g. AAPL.NASDAQ (blank = all-identity update, where supported)" size="40">
  </label>
  <label>Since<input type="date" id="since"></label>
  <label>Until<input type="date" id="until"></label>
  <label>
    <input type="checkbox" id="force" style="width:auto;">
    Force full history (ignores Since/Until, refetches from the beginning)
  </label>
</form>

<table>
  <thead>
    <tr>
      <th>URI</th>
      <th>Local Data Since</th>
      <th>Local Data Until</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr data-uri="{{ row.uri }}">
      <td class="uri">{{ row.uri }}</td>
      <td class="since">{{ row.since }}</td>
      <td class="until">{{ row.until }}</td>
      <td>
        <button onclick="runUpdate(this)">Update</button>
        <span class="status"></span>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<script src="{{ url_for('static', filename='poll.js') }}"></script>
<script>
function runUpdate(button) {
  var row = button.closest('tr');
  var uri = row.dataset.uri;
  var identity = document.getElementById('identity').value.trim();
  var since = document.getElementById('since').value;
  var until = document.getElementById('until').value;
  var force = document.getElementById('force').checked;
  var statusEl = row.querySelector('.status');

  button.disabled = true;
  statusEl.textContent = 'Running...';

  postJSON('/api/execute_update', { uri: uri, identity: identity, since: since, until: until, force: force })
    .then(function (data) {
      return pollUntilDone('/api/resource_status/' + data.res_id, function (tick) {
        statusEl.textContent = tick.finished ? 'Finalizing...' : 'Running...';
      });
    })
    .then(function () {
      var params = new URLSearchParams({ uri: uri, identity: identity });
      return fetch('/api/data_range?' + params.toString()).then(function (r) { return r.json(); });
    })
    .then(function (range) {
      row.querySelector('.since').textContent = range.since || '-';
      row.querySelector('.until').textContent = range.until || '-';
      statusEl.textContent = 'Done.';
    })
    .catch(function (err) {
      statusEl.textContent = 'Error: ' + err;
    })
    .finally(function () {
      button.disabled = false;
    });
}
</script>
{% endblock %}
