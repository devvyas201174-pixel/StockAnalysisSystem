<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}StockAnalysisSystem{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <span class="brand">StockAnalysisSystem</span>
    <a href="{{ url_for('data_hub') }}">Data Hub</a>
    <a href="{{ url_for('browse') }}">Browse</a>
    <a href="{{ url_for('analyze') }}">Analyze</a>
    <a href="{{ url_for('factors') }}">Factors</a>
    <a href="{{ url_for('config') }}">Config</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
